<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d4440">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solitaire">
  <title>It's Just Solitaire</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Original suit shapes, drawn for this project (viewBox 0 0 100 100). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="s-H" viewBox="0 0 100 100">
      <path d="M50 90 C22 70 4 52 4 32 C4 17 16 6 30 6 C39 6 46 11 50 19 C54 11 61 6 70 6 C84 6 96 17 96 32 C96 52 78 70 50 90 Z"/>
    </symbol>
    <symbol id="s-D" viewBox="0 0 100 100">
      <path d="M50 3 C60 20 73 36 88 50 C73 64 60 80 50 97 C40 80 27 64 12 50 C27 36 40 20 50 3 Z"/>
    </symbol>
    <symbol id="s-S" viewBox="0 0 100 100">
      <path d="M50 4 C62 22 94 38 94 60 C94 74 83 82 71 82 C63 82 57 78 53 72 C54 82 58 90 66 96 L34 96 C42 90 46 82 47 72 C43 78 37 82 29 82 C17 82 6 74 6 60 C6 38 38 22 50 4 Z"/>
    </symbol>
    <symbol id="s-C" viewBox="0 0 100 100">
      <circle cx="50" cy="28" r="20"/><circle cx="27" cy="58" r="20"/><circle cx="73" cy="58" r="20"/>
      <circle cx="50" cy="54" r="12"/>
      <path d="M46 56 C46 76 41 88 32 96 L68 96 C59 88 54 76 54 56 Z"/>
    </symbol>
  </svg>

  <header class="topbar">
    <div class="brand-row">
      <div class="brand">It's Just Solitaire</div>
      <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound on">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="spk" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
          <path class="on" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/>
          <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
      <div class="stat"><span class="label">Time</span><span id="time" class="value">0:00</span></div>
      <div class="stat"><span class="label">Moves</span><span id="moves" class="value">0</span></div>
    </div>
  </header>

  <main id="board" class="board" aria-label="Solitaire table"></main>

  <button id="btn-auto" class="auto-finish" type="button" hidden>Auto Finish</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="toolbar">
    <button id="btn-new" class="tool" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>New</span>
    </button>
    <button id="btn-mode" class="tool" type="button" aria-label="Change draw mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="11" height="14" rx="2"/><path d="M9 4h9a2 2 0 0 1 2 2v12"/></svg>
      <span id="mode-label">Draw 1</span>
    </button>
    <button id="btn-hint" class="tool" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span>Hint</span>
    </button>
    <button id="btn-stats" class="tool" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-11"/></svg>
      <span>Stats</span>
    </button>
    <button id="btn-undo" class="tool" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span>Undo</span>
    </button>
  </nav>

  <div id="modal-stats" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title">Statistics</h2>
      <div class="segmented" role="tablist">
        <button type="button" role="tab" data-stats-mode="1">Draw 1</button>
        <button type="button" role="tab" data-stats-mode="3">Draw 3</button>
      </div>
      <div class="stat-grid">
        <div><strong id="st-played">0</strong><span>Played</span></div>
        <div><strong id="st-won">0</strong><span>Won</span></div>
        <div><strong id="st-rate">0%</strong><span>Win rate</span></div>
        <div><strong id="st-streak">0</strong><span>Current streak</span></div>
        <div><strong id="st-best-streak">0</strong><span>Best streak</span></div>
        <div><strong id="st-best-score">–</strong><span>Best score</span></div>
        <div><strong id="st-best-time">–</strong><span>Fastest win</span></div>
        <div><strong id="st-fewest">–</strong><span>Fewest moves</span></div>
      </div>
      <div class="sheet-actions">
        <button class="ghost danger" type="button" id="btn-reset-stats">Reset stats</button>
        <button class="ghost" type="button" data-close>Close</button>
      </div>
    </div>
  </div>

  <div id="modal-new" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="new-title">
      <h2 id="new-title">New game</h2>
      <p>How many cards should the stock turn over at a time?</p>
      <div class="choices">
        <button class="choice" type="button" data-draw="1"><strong>Draw 1</strong><span>Relaxed</span></button>
        <button class="choice" type="button" data-draw="3"><strong>Draw 3</strong><span>Classic challenge</span></button>
      </div>
      <button class="ghost" type="button" data-close>Keep playing</button>
    </div>
  </div>

  <div id="modal-win" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title">You won!</h2>
      <div class="win-stats">
        <div><span class="label">Score</span><strong id="win-score">0</strong></div>
        <div><span class="label">Time</span><strong id="win-time">0:00</strong></div>
        <div><span class="label">Moves</span><strong id="win-moves">0</strong></div>
      </div>
      <p id="win-bonus" class="bonus"></p>
      <p id="win-best" class="best"></p>
      <div class="choices">
        <button class="choice primary" type="button" id="btn-again"><strong>Play again</strong><span id="again-mode">Draw 1</span></button>
        <button class="choice" type="button" id="btn-change"><strong>Change mode</strong><span>Draw 1 or 3</span></button>
      </div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
